[package]
name = "surrealdb-iroh"
version = "0.1.0"
edition = "2021"
description = "P2P replication layer for SurrealDB embedded databases using Iroh"
authors = ["Vincent Palmer"]
license = "BSL-1.1"
repository = "https://github.com/vincents-ai/surrealdb-iroh"
homepage = "https://github.com/vincents-ai/surrealdb-iroh"
rust-version = "1.91"

[[bench]]
name = "sync_bench"
harness = false

[dependencies]
# Iroh networking stack (1.0.0-rc.0 requires rust 1.91)
iroh = { version = "1.0.0-rc.0", features = ["metrics", "fast-apple-datapath", "portmapper", "tls-ring"] }

# Serialization
bytes = { version = "1.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "3.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
futures-lite = "2.0"

# Utilities
n0-future = "0.2"
parking_lot = "0.12"

# Tracing for observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
base64 = "0.22"
url = "2.5"

# OpenTelemetry (optional)
opentelemetry = { version = "0.26", optional = true }
opentelemetry-otlp = { version = "0.17", optional = true }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { version = "0.27", optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.17", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3.24"
tokio-test = "0.4"
tracing-test = "0.2"
criterion = { version = "0.5", default-features = false }
proptest = "1.5"
pretty_assertions = "1.4"

[features]
# OpenTelemetry observability features
opentelemetry = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
observability = ["opentelemetry", "metrics"]

# Compression for sync messages (optional)
compression = ["dep:zstd"]